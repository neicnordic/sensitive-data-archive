{{- if or (or (eq "all" .Values.global.deploymentType) (eq "external" .Values.global.deploymentType) ) (not .Values.global.deploymentType) }}
{{- if not (empty .Values.global.inbox.s3) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ template "sda.fullname" . }}-auth
  labels:
    app: {{ template "sda.fullname" . }}-auth
spec:
  ports:
  - name: auth
    port: {{ ternary 443 80 ( .Values.global.tls.enabled ) }}
    targetPort: auth
    protocol: TCP
  {{- if eq "prometheus" .Values.global.observability.OTEL_METRICS_EXPORTER }}
  - name: prometheus
    port: {{ default 9464 .Values.global.observability.OTEL_EXPORTER_PROMETHEUS_PORT }}
    targetPort: prometheus
    protocol: TCP
  {{- end }}
  selector:
    app: {{ template "sda.fullname" . }}-auth
{{- end }}
{{- end }}
