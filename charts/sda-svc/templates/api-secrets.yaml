{{- if or (or (eq "all" .Values.global.deploymentType) (eq "external" .Values.global.deploymentType) ) (not .Values.global.deploymentType)}}
{{- if not .Values.global.vaultSecrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "sda.fullname" . }}-api
type: Opaque
stringData:
  config.yaml: |-
    rbac_file: {{ template "secretsPath" . }}/rbac.json
    {{- if .Values.global.tls.enabled }}
    external_tls: true
    ca_cert: {{ template "tlsPath" . }}/ca.crt
    client_cert: {{ template "tlsPath" . }}/tls.crt
    client_key: {{ template "tlsPath" . }}/tls.key
    {{- end }}
    reencrypt_host: {{ required "A valid grpc host is required" .Values.global.reencrypt.host }}
    {{- if .Values.global.reencrypt.port}}
    reencrypt_port: {{ .Values.global.reencrypt.port }}
    {{- end }}
    {{- if not (or .Values.global.api.jwtPubKeyName .Values.global.oidc.provider) }}
    {{- fail "Either global.api.jwtPubKeyName or global.oidc.provider must be configured" }}
    {{- end }}
    {{- if .Values.global.api.jwtPubKeyName }}
    jwt_pub_key_path: {{ include "jwtPath" . }}
    {{- end }}
    {{- if .Values.global.oidc.provider }}
    jwt_pub_key_url: "{{ .Values.global.oidc.provider | trimSuffix "/" }}/{{ required "A valid OIDC JWK path is required when global.oidc.provider is configured" .Values.global.oidc.jwkPath | trimPrefix "/" }}"
      {{- end }}
    schema_type: {{ default "federated" .Values.global.schemaType }}
    broker:
    {{- if .Values.global.tls.enabled }}
      ca_cert: {{ template "tlsPath" . }}/ca.crt
      {{- if .Values.global.broker.verifyPeer }}
      client_cert: {{ template "tlsPath" . }}/tls.crt
      client_key: {{ template "tlsPath" . }}/tls.key
      {{- end }}
    {{- end }}
      exchange: {{ default "sda" .Values.global.broker.exchange }}
      host: {{ required "A valid MQ host is required" .Values.global.broker.host }}
      port: {{ default (ternary 5671 5672 .Values.global.tls.enabled) .Values.global.broker.port }}
      prefetch_count: {{ default 1 .Values.global.broker.prefetchCount }}
      password: {{ required "MQ password is required" (include "mqPassAPI" .) }}
      ssl: {{ .Values.global.tls.enabled }}
      user: {{ required "MQ user is required" (include "mqUserAPI" .) }}
      vhost: {{ include "brokerVhost" . }}
    database:
    {{- if .Values.global.tls.enabled }}
      ca_cert: {{ template "tlsPath" . }}/ca.crt
      {{- if eq "verify-full" .Values.global.db.sslMode}}
      client_cert: {{ template "tlsPath" . }}/tls.crt
      client_key: {{ template "tlsPath" . }}/tls.key
      {{- end }}
    {{- end }}
      host: {{ .Values.global.db.host }}
      name: {{ .Values.global.db.name }}
      password: {{ required "DB password is required" (include "dbPassAPI" .) }}
      port: {{ .Values.global.db.port }}
      ssl_mode: {{ ternary .Values.global.db.sslMode "disable" .Values.global.tls.enabled }}
      user: {{ required "DB user is required" (include "dbUserAPI" .) }}
      max_idle_connections: {{ .Values.global.db.maxIdleConnections }}
      max_open_connections: {{ .Values.global.db.maxOpenConnections }}
      connection_max_idle_time: {{ .Values.global.db.connectionMaxIdleTime }}
      connection_max_life_time: {{ .Values.global.db.connectionMaxLifeTime }}
    storage:
      inbox:
    {{- if eq "s3" .Values.global.inbox.storageType }}
        s3:
        - endpoint: {{ required "S3 inbox URL missing" .Values.global.inbox.s3Url }}{{- if .Values.global.inbox.s3Port }}:{{.Values.global.inbox.s3Port}}{{- end }}
          access_key: {{ required "Accesskey required for inbox" .Values.global.inbox.s3AccessKey }}
          secret_key: {{ required "Secretkey required for inbox" .Values.global.inbox.s3SecretKey }}
          bucket_prefix: {{ required "S3 inbox bucket prefix not set" .Values.global.inbox.s3BucketPrefix }}
          region: {{ default "us-east-1" .Values.global.inbox.s3Region }}
          {{- if .Values.global.tls.enabled }}
          ca_cert: {{ template "tlsPath" . }}/ca.crt
          {{- end }}
          disable_https: {{ not .Values.global.tls.enabled }}
    {{- else }}
        posix:
        - path: {{ .Values.global.inbox.volumePath }}
    {{- end }}
---
{{- if not .Values.global.api.adminsFileSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "sda.fullname" . }}-api-admins
type: Opaque
data:
  admins.json: {{ .Values.global.api.adminUsers | toJson | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}
