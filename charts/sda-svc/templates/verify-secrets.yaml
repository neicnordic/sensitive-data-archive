
{{- if or (or (eq "all" .Values.global.deploymentType) (eq "internal" .Values.global.deploymentType) ) (not .Values.global.deploymentType)}}
{{- if not .Values.global.vaultSecrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "sda.fullname" . }}-verify
type: Opaque
stringData:
  config.yaml: |-
    storage:
    {{- include "sda.requireBackend" (dict "path" "global.archive" "config" .Values.global.archive) }}
    {{- include "sda.storageBackend" (dict
        "backend" "archive"
        "config" .Values.global.archive
        "tls" .Values.global.tls.enabled
        "tlsPath" (include "tlsPath" .)) | nindent 6 }}
    {{- include "sda.locationBrokerCacheTTL" (dict "ctx" . "priority" (list "archive")) | nindent 4 }}
    broker:
    {{- if .Values.global.tls.enabled }}
      ca_cert: {{ template "tlsPath" . }}/ca.crt
      {{- if .Values.global.broker.verifyPeer }}
      client_cert: {{ template "tlsPath" . }}/tls.crt
      client_key: {{ template "tlsPath" . }}/tls.key
      {{- end }}
    {{- end }}
      exchange: {{ default "sda" .Values.global.broker.exchange }}
      host: {{ required "A valid MQ host is required" .Values.global.broker.host }}
      port: {{ default (ternary 5671 5672 .Values.global.tls.enabled) .Values.global.broker.port }}
      prefetch_count: {{ default 1 .Values.global.broker.prefetchCount }}
      password: {{ required "MQ password is required" (include "mqPassVerify" .) }}
      ssl: {{ .Values.global.tls.enabled }}
      user: {{ required "MQ user is required" (include "mqUserVerify" .) }}
      vhost: {{ include "brokerVhost" . }}
    c4gh:
      privateKeys:
      {{- range $k := .Values.global.c4gh.privateKeys }}
        - filePath: {{ template "c4ghPath" $ }}/{{ $k.keyName }}
          passphrase: {{ $k.passphrase }}
      {{- end }}
    database:
    {{- if .Values.global.tls.enabled }}
      ca_cert: {{ template "tlsPath" . }}/ca.crt
      client_cert: {{ template "tlsPath" . }}/tls.crt
      client_key: {{ template "tlsPath" . }}/tls.key
    {{- end }}
      host: {{ .Values.global.db.host }}
      name: {{ .Values.global.db.name }}
      password: {{ required "DB password is required" (include "dbPassVerify" .) }}
      port: {{ .Values.global.db.port }}
      ssl_mode: {{ ternary .Values.global.db.sslMode "disable" .Values.global.tls.enabled }}
      user: {{ required "DB user is required" (include "dbUserVerify" .) }}
      max_idle_connections: {{ .Values.global.db.maxIdleConnections }}
      max_open_connections: {{ .Values.global.db.maxOpenConnections }}
      connection_max_idle_time: {{ .Values.global.db.connectionMaxIdleTime }}
      connection_max_life_time: {{ .Values.global.db.connectionMaxLifeTime }}
    log:
      format: {{ .Values.global.log.format }}
      level: {{ .Values.global.log.level }}
    source_queue: "archived"
    destination_queue: "verified"
    schema_type: {{ default "federated" .Values.global.schemaType }}
{{- end }}
{{- end }}
