{{- if or (or (eq "all" .Values.global.deploymentType) (eq "internal" .Values.global.deploymentType) ) (not .Values.global.deploymentType) }}
{{- if eq "prometheus" .Values.global.observability.env.OTEL_METRICS_EXPORTER }}
{{- if .Values.global.observability.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ template "sda.fullname" . }}-verify
  labels:
    app: {{ template "sda.fullname" . }}-verify
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    component: {{ template "sda.fullname" . }}-verify
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    {{- if .Values.global.observability.serviceMonitor.labels }}
{{ toYaml .Values.global.observability.serviceMonitor.labels | indent 4 }}
    {{- end }}
  {{- if .Values.global.observability.serviceMonitor.annotations }}
  annotations:
{{ toYaml .Values.global.observability.serviceMonitor.annotations | indent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      app: {{ template "sda.fullname" . }}-verify
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace | quote }}
  endpoints:
    - port: prometheus
      {{- if .Values.global.observability.serviceMonitor.interval }}
      interval: {{ .Values.global.observability.serviceMonitor.interval }}
      {{- end }}
      {{- if .Values.global.observability.serviceMonitor.scrapeTimeout }}
      scrapeTimeout: {{ .Values.global.observability.serviceMonitor.scrapeTimeout }}
      {{- end }}
      {{- if .Values.global.observability.serviceMonitor.scheme }}
      scheme: {{ .Values.global.observability.serviceMonitor.scheme | quote }}
      {{- end }}
      {{- with .Values.global.observability.serviceMonitor.tlsConfig }}
      tlsConfig:
        {{ toYaml . | nindent 8 }}
      {{- end }}
  {{- with .Values.global.observability.serviceMonitor.targetLabels }}
  targetLabels:
    {{ toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}