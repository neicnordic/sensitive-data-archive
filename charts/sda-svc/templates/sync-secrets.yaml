{{- if ne "federated" .Values.global.schemaType }}
{{- if .Values.global.sync.enabled }}
{{- if or (or (eq "all" .Values.global.deploymentType) (eq "internal" .Values.global.deploymentType) ) (not .Values.global.deploymentType)}}
{{- if not .Values.global.vaultSecrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "sda.fullname" . }}-sync
type: Opaque
stringData:
  config.yaml: |-
    storage:
    {{- include "sda.requireBackend" (dict "path" "global.archive" "config" .Values.global.archive) }}
    {{- include "sda.requireBackend" (dict "path" "global.sync.destination" "config" .Values.global.sync.destination) }}
    {{- include "sda.storageBackend" (dict
        "backend" "archive"
        "config" .Values.global.archive
        "tls" .Values.global.tls.enabled
        "tlsPath" (include "tlsPath" .)) | nindent 6 }}
    {{- include "sda.storageBackend" (dict
        "backend" "sync"
        "valuesPath" "sync.destination"
        "config" .Values.global.sync.destination
        "tls" .Values.global.tls.enabled
        "tlsPath" (include "tlsPath" .)) | nindent 6 }}
    {{- include "sda.locationBrokerCacheTTL" (dict "ctx" . "priority" (list "syncDestination" "archive")) | nindent 4 }}
    source_queue: {{ default "mapping_stream" .Values.global.sync.brokerQueue }}
    broker:
    {{- if .Values.global.tls.enabled }}
      ca_cert: {{ template "tlsPath" . }}/ca.crt
      {{- if .Values.global.broker.verifyPeer }}
      client_cert: {{ template "tlsPath" . }}/tls.crt
      client_key: {{ template "tlsPath" . }}/tls.key
      {{- end }}
    {{- end }}
      exchange: {{ default "sda" .Values.global.broker.exchange }}
      host: {{ required "A valid MQ host is required" .Values.global.broker.host }}
      port: {{ default (ternary 5671 5672 .Values.global.tls.enabled) .Values.global.broker.port }}
      prefetch_count: {{ default 1 .Values.global.broker.prefetchCount }}
      password: {{ required "MQ password is required" (include "mqPassSync" .) }}
      ssl: {{ .Values.global.tls.enabled }}
      user: {{ required "MQ user is required" (include "mqUserSync" .) }}
      vhost: {{ include "brokerVhost" . }}
    c4gh:
      filePath: {{ template "c4ghPath" . }}/{{ (first .Values.global.c4gh.privateKeys).keyName }}
      passphrase: {{ (first .Values.global.c4gh.privateKeys).passphrase }}
    database:
    {{- if .Values.global.tls.enabled }}
      ca_cert: {{ template "tlsPath" . }}/ca.crt
      client_cert: {{ template "tlsPath" . }}/tls.crt
      client_key: {{ template "tlsPath" . }}/tls.key
    {{- end }}
      host: {{ .Values.global.db.host }}
      name: {{ .Values.global.db.name }}
      password: {{ required "DB password is required" (include "dbPassSync" .) }}
      port: {{ .Values.global.db.port }}
      ssl_mode: {{ ternary .Values.global.db.sslMode "disable" .Values.global.tls.enabled }}
      user: {{ required "DB user is required" (include "dbUserSync" .) }}
      max_idle_connections: {{ .Values.global.db.maxIdleConnections }}
      max_open_connections: {{ .Values.global.db.maxOpenConnections }}
      connection_max_idle_time: {{ .Values.global.db.connectionMaxIdleTime }}
      connection_max_life_time: {{ .Values.global.db.connectionMaxLifeTime }}
    log:
      format: {{ .Values.global.log.format }}
      level: {{ .Values.global.log.level }}
    schema_type: {{ default "isolated" .Values.global.schemaType }}
    sync:
      c4gh_pub_key_path: {{ template "c4ghPath" . }}/{{ required "remote sync public c4gh key is missing" .Values.global.c4gh.syncPubKey }}
      dataset_with_prefix: {{ .Values.global.sync.centerPrefix }}
    {{- if not (empty .Values.global.sync.remote.url) }}
    remote:
      url: {{ .Values.global.sync.remote.url }}
      {{- if and (not (empty .Values.global.sync.remote.user)) (not (empty .Values.global.sync.remote.password)) }}
      password: {{ .Values.global.sync.remote.password }}
      user: {{ .Values.global.sync.remote.user }}
      {{- end }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
