{{- if or (or (eq "all" .Values.global.deploymentType) (eq "internal" .Values.global.deploymentType) ) (not .Values.global.deploymentType) }}
{{- if eq "prometheus" .Values.global.observability.env.OTEL_METRICS_EXPORTER }}
apiVersion: v1
kind: Service
metadata:
  name: {{ template "sda.fullname" . }}-finalize
  labels:
    app: {{ template "sda.fullname" . }}-finalize
spec:
  ports:
  - name: prometheus
    port: {{ default 9464 .Values.global.observability.env.OTEL_EXPORTER_PROMETHEUS_PORT }}
    targetPort: prometheus
    protocol: TCP
  selector:
    app: {{ template "sda.fullname" . }}-finalize
{{- end }}
{{- end }}
