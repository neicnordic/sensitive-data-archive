{{- if or (or (eq "all" .Values.global.deploymentType) (eq "external" .Values.global.deploymentType) ) (not .Values.global.deploymentType) }}
{{- if or (not (empty .Values.global.inbox.s3)) (not (empty .Values.global.inbox.posix)) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ template "sda.fullname" . }}-inbox
  labels:
    app: {{ template "sda.fullname" . }}-inbox
spec:
  ports:
  - name: inbox
    port: {{ template "inboxServicePort" . }}
    targetPort: inbox
    protocol: TCP
  {{- if and (eq "prometheus" .Values.global.observability.OTEL_METRICS_EXPORTER) (not (empty .Values.global.inbox.s3)) }}
  - name: prometheus
    port: {{ default 9464 .Values.global.observability.OTEL_EXPORTER_PROMETHEUS_PORT }}
    targetPort: prometheus
    protocol: TCP
  {{- end }}
  selector:
    app: {{ template "sda.fullname" . }}-inbox
{{- end }}
{{- end }}