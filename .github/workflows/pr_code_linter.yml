name: Linter

# Called by the PR workflow, whose `changes` job selects the modules a change touches
on:
  workflow_call:
    inputs:
      sda:
        type: boolean
        default: false
      download:
        type: boolean
        default: false
      admin:
        type: boolean
        default: false
      validator:
        type: boolean
        default: false

env:
  go-version: '1.27'
  go-version-validator-orchestrator: '1.27'

jobs:
  lint_sda_download:
    if: inputs.download
    name: Lint download code
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      - name: Set up Go ${{ env.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.go-version }}
          cache-dependency-path: sda-download/go.sum
        id: go

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
          args: --timeout 5m
          working-directory: sda-download

  lint_sda:
    if: inputs.sda
    name: Lint sda code
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      - name: Set up Go ${{ env.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.go-version }}
          cache-dependency-path: sda/go.sum
        id: go

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
          args: --timeout 5m
          working-directory: sda

  lint_sda_validator_orchestrator:
    if: inputs.validator
    name: Lint sda validator orchestrator
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      - name: Set up Go ${{ env.go-version-validator-orchestrator }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.go-version-validator-orchestrator }}
          cache-dependency-path: sda-validator/orchestrator/go.sum
        id: go

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
          args: --timeout 5m
          working-directory: sda-validator/orchestrator

  lint_sda_admin:
    if: inputs.admin
    name: Lint sda-admin code
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      - name: Set up Go ${{ env.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.go-version }}
          cache-dependency-path: sda-admin/go.sum
        id: go

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
          args: --timeout 5m
          working-directory: sda-admin
