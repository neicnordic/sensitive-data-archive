name: Postgres tests (large)

on:
  pull_request:
    paths:
      - "postgresql/**"
      - "!postgresql/**/*.md"
      - ".github/integration/postgres-scale.yml"
      - ".github/integration/scripts/seed_migrate_db.sh"
      - ".github/integration/tests/postgres-scale/**"
      - ".github/integration/tests/postgres/sda-schema-0.sql"
      - ".github/integration/tests/run_scripts.sh"
      - ".github/workflows/pr_postgres_scale.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COMPOSE: docker compose -f .github/integration/postgres-scale.yml
  KILL_INTERVAL: 60
  MAX_RESTARTS: 15

jobs:
  migrate_at_scale:
    name: Migrate a seeded database under a liveness probe
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Seed and start the migration
        run: $COMPOSE up -d --build migrate

      # The sda-db chart's liveness probe connects over TCP, which the server
      # that runs the migrations does not listen on, so a pod is killed about
      # a minute into any migration. Do the same here until migrate is healthy.
      - name: Kill migrate every minute until it is healthy
        run: |
          for i in $(seq 0 "$MAX_RESTARTS"); do
            sleep "$KILL_INTERVAL"
            if [ "$(docker inspect -f '{{.State.Health.Status}}' migrate)" = healthy ]; then
              echo "healthy after $i restarts"
              exit 0
            fi
            if [ "$i" -lt "$MAX_RESTARTS" ]; then
              echo "restart $((i + 1))"
              $COMPOSE restart -t 0 migrate
            fi
          done
          echo "migrate never became healthy within $MAX_RESTARTS restarts"
          exit 1

      - name: Test the migrated database
        run: $COMPOSE run tests

      - name: Migration timings
        if: always()
        run: |
          {
            echo "| script | runs | seconds |"
            echo "|---|---|---|"
            docker exec migrate cat /var/lib/postgresql/data/migration_timings.log |
              awk '{ runs[$2]++; secs[$2]+=$3 } END { for (s in runs) print "| " s " | " runs[s] " | " secs[s] " |" }' | sort
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Migrate container log
        if: failure()
        run: docker logs migrate
