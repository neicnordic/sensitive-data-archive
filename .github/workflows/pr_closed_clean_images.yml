name: clean image registry
on:
  schedule:
    - cron: '0 8 * * *'  # Run daily at 08:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only log what would be deleted"
        type: boolean
        default: true

# Two runs at the same time could delete what the other one is checking.
concurrency:
  group: clean-image-registry
  cancel-in-progress: false

jobs:
  clean_pr_images_from_registry:
    name: Cleanup PR docker images from Github Container registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # Deletes only on the schedule and on a manual run with dry_run unchecked.
      - name: Delete unused container versions
        run: .github/scripts/clean_ghcr_images.sh neicnordic sensitive-data-archive ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.dry_run) }}

      - name: Check that every tagged image still pulls
        if: ${{ !cancelled() }}
        run: .github/scripts/check_tagged_images.sh neicnordic sensitive-data-archive
