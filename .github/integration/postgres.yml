services:
  certfixer:
    command:
      - /bin/sh
      - /scripts/make_certs.sh
    container_name: certfixer
    image: alpine:latest
    volumes:
      - ./scripts:/scripts
      - certs:/certs
      - client_certs:/client_certs
      - /tmp:/temp
  credentials:
    container_name: credentials
    command:
      - "/bin/sh"
      - "/scripts/make_db_credentials.sh"
    depends_on:
      migrate:
        condition: service_healthy
      postgres:
        condition: service_healthy
      postgres_tls:
        condition: service_healthy
    environment:
      - PGPASSWORD=rootpasswd
    image: ubuntu:latest
    volumes:
      - ./scripts:/scripts

  # Migration test: migrate_seed initialises the pgmigrate volume and
  # restores tests/postgres/sda-schema-0.sql (an sda database at schema
  # version 0) into it, then exits. Only then does migrate start on the
  # volume; it finds PG_VERSION, so the entrypoint runs every script in
  # migratedb.d instead of initdb. 10_sanity_check.sh checks that the
  # fixture's version 0 row is still there, which fails on a fresh initdb.
  migrate_seed:
    container_name: migrate_seed
    command:
      - /sda-schema-0.sql
    entrypoint:
      - /scripts/seed_migrate_db.sh
    environment:
      - POSTGRES_PASSWORD=rootpasswd
    image: ghcr.io/neicnordic/sensitive-data-archive:PR${PR_NUMBER}-postgres
    volumes:
      - ./scripts:/scripts
      - ./tests/postgres/sda-schema-0.sql:/sda-schema-0.sql
      - pgmigrate:/var/lib/postgresql/data

  migrate:
    container_name: migrate
    depends_on:
      migrate_seed:
        condition: service_completed_successfully
    environment:
      - POSTGRES_PASSWORD=rootpasswd
    healthcheck:
      # over TCP: the temporary server that runs the migrations only has the socket
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      interval: 5s
      timeout: 20s
      retries: 3
    image: ghcr.io/neicnordic/sensitive-data-archive:PR${PR_NUMBER}-postgres
    ports:
      - "35432:5432"
    restart: always
    volumes:
      - pgmigrate:/var/lib/postgresql/data

  postgres:
    build:
      context: ../../postgresql
    container_name: db
    environment:
      - POSTGRES_PASSWORD=rootpasswd
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 20s
      retries: 3
    image: ghcr.io/neicnordic/sensitive-data-archive:PR${PR_NUMBER}-postgres
    ports:
      - "15432:5432"
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql/data

  postgres_tls:
    container_name: tlsdb
    depends_on:
      certfixer:
        condition: service_completed_successfully
      postgres:
        condition: service_started
    environment:
      - POSTGRES_PASSWORD=rootpasswd
      - POSTGRES_SERVER_CACERT=/certs/ca.crt
      - POSTGRES_SERVER_CERT=/certs/db.crt
      - POSTGRES_SERVER_KEY=/certs/db.key
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 20s
      retries: 3
    image: ghcr.io/neicnordic/sensitive-data-archive:PR${PR_NUMBER}-postgres
    ports:
      - "25432:5432"
    restart: always
    volumes:
      - certs:/certs
      - pgtlsdata:/var/lib/postgresql/data

  tests:
    container_name: tester
    command:
      - "/bin/sh"
      - "/tests/run_scripts.sh"
      - "/tests/postgres"
    depends_on:
      credentials:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrate:
        condition: service_healthy
    environment:
      - PGPASSWORD=rootpasswd
    image: ubuntu:latest
    profiles:
      - tests
    volumes:
      - ./tests:/tests
      - client_certs:/certs
      - ../../postgresql/migratedb.d:/migratedb.d

volumes:
  certs:
  client_certs:
  pgdata:
  pgmigrate:
  pgtlsdata:

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1400"