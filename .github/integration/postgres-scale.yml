# Migration test at production size: migrate_seed restores the schema
# version 0 fixture, migrates to version 23 and seeds SEED_FILES files with
# events, then migrate runs the remaining scripts on that data. The
# workflow kills migrate every KILL_INTERVAL seconds until it is healthy,
# the way the sda-db liveness probe does to a pod, so only a migration that
# commits its progress gets through. tests then checks the result.
services:
  migrate_seed:
    build:
      context: ../../postgresql
    container_name: migrate_seed
    command:
      - /sda-schema-0.sql
    entrypoint:
      - /scripts/seed_migrate_db.sh
    environment:
      - POSTGRES_PASSWORD=rootpasswd
      - SEED_FILES=${SEED_FILES:-1500000}
      - SEED_EVENTS_PER_FILE=${SEED_EVENTS_PER_FILE:-4}
    image: sda-postgres-scale
    volumes:
      - ./scripts:/scripts
      - ./tests/postgres/sda-schema-0.sql:/sda-schema-0.sql
      - pgmigrate:/var/lib/postgresql/data

  migrate:
    container_name: migrate
    depends_on:
      migrate_seed:
        condition: service_completed_successfully
    environment:
      - POSTGRES_PASSWORD=rootpasswd
    healthcheck:
      # over TCP: the temporary server that runs the migrations only has the socket
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      interval: 5s
      timeout: 20s
      retries: 3
    image: sda-postgres-scale
    # a BestEffort pod on a small node: no room to cache the whole database
    mem_limit: 1g
    restart: always
    volumes:
      - pgmigrate:/var/lib/postgresql/data

  tests:
    container_name: tester
    command:
      - "/bin/sh"
      - "/tests/run_scripts.sh"
      - "/tests/postgres-scale"
    depends_on:
      migrate:
        condition: service_healthy
    environment:
      - PGPASSWORD=rootpasswd
    image: ubuntu:latest
    profiles:
      - tests
    volumes:
      - ./tests:/tests
      - ../../postgresql/migratedb.d:/migratedb.d
      - pgmigrate:/pgmigrate:ro

volumes:
  pgmigrate:

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1400"
