# Docker Compose for download service integration tests
# Based on validator-orchestrator pattern - Go-based tests running in container

services:
  # PostgreSQL with SDA schema
  postgres:
    build:
      context: ../../postgresql
    container_name: postgres
    environment:
      - POSTGRES_PASSWORD=rootpasswd
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 2s
      retries: 6
    image: ghcr.io/neicnordic/sensitive-data-archive:PR${PR_NUMBER}-postgres
    extra_hosts:
      - "localhost:host-gateway"
    ports:
      - "15432:5432"
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # MinIO for archive storage
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    container_name: s3
    environment:
      - MINIO_ROOT_USER=access
      - MINIO_ROOT_PASSWORD=secretKey
      - MINIO_SERVER_URL=http://127.0.0.1:9000
    healthcheck:
      test: ["CMD", "curl", "-fkq", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 2s
      retries: 6
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - minio_data:/data

  # Mock AAI for JWT validation
  mock-aai:
    container_name: ls-aai-mock
    depends_on:
      aai-db:
        condition: service_healthy
    environment:
      - DOCKERHOST=localhost
    healthcheck:
      test: ["CMD", "/bin/true"]
      interval: 10s
      timeout: 2s
      retries: 6
    image: harbor.nbis.se/test/ls_aai_mock:2.5.3-broker2.1.13-tomcat9.0-jdk21
    ports:
      - "8800:8080"
    volumes:
      - "./sda/aai-mock:/etc/lsaai-mock"

  aai-db:
    container_name: ls-aai-db
    environment:
      MYSQL_ROOT_PASSWORD: "aaiPass"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: "aai"
      MYSQL_USER: "aai"
      MYSQL_PASSWORD: "aaiPass"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 2s
      retries: 6
    image: mysql/mysql-server:latest
    volumes:
      - ./sda/aai-mock/aai-mock.sql:/docker-entrypoint-initdb.d/1.sql

  # Credentials generator - creates JWT keys and test tokens
  credentials:
    container_name: credentials
    command:
      - "/bin/sh"
      - "-c"
      - |
        set -e
        sh /scripts/make_download_credentials.sh
        sh /scripts/make_download_v2_testfile.sh
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PGPASSWORD=rootpasswd
    image: python:3.11-slim-bookworm
    volumes:
      - ./scripts:/scripts
      - shared:/shared

  # Initialize MinIO with archive bucket and the header-stripped test file body
  minio_init:
    container_name: minio_init
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
      credentials:
        condition: service_completed_successfully
    entrypoint: >
      /bin/sh -c "
      set -e;
      mc alias set myminio http://s3:9000 access secretKey;
      mc mb myminio/archive || true;
      mc cp /shared/testfile.body myminio/archive/test-file.c4gh;
      echo 'MinIO initialized with archive bucket and test file';
      "
    volumes:
      - shared:/shared

  # Seed database with test data (files and datasets)
  database_seed:
    container_name: database_seed
    image: postgres:15.4-alpine
    depends_on:
      credentials:
        condition: service_completed_successfully
      minio_init:
        condition: service_completed_successfully
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=rootpasswd
      - PGDATABASE=sda
    command:
      - "/bin/sh"
      - "-c"
      - |
        sh /scripts/seed_download_v2_db.sh
    volumes:
      - ./scripts:/scripts
      - shared:/shared

  # Mock OIDC server for opaque token auth and visa validation
  mockauth:
    command:
      - /bin/sh
      - -c
      - |
        pip install --upgrade pip > /dev/null
        pip install aiohttp Authlib joserfc > /dev/null
        python -u /mockoidc.py
    container_name: mockauth
    image: python:3.10-slim
    volumes:
      - ./scripts/mockoidc.py:/mockoidc.py
    ports:
      - "8000:8000"
    restart: always

  # Re-encrypt gRPC service
  reencrypt:
    image: ghcr.io/neicnordic/sensitive-data-archive:PR${PR_NUMBER}
    command: [sda-reencrypt]
    container_name: reencrypt
    depends_on:
      credentials:
        condition: service_completed_successfully
    ports:
      - "50051:50051"
    restart: always
    volumes:
      - ./sda/config.yaml:/config.yaml
      - shared:/shared

  # Download service under test
  download:
    image: ghcr.io/neicnordic/sensitive-data-archive:PR${PR_NUMBER}
    command:
      - sda-download
      - "--config-file=/config.yaml"
    container_name: download
    depends_on:
      credentials:
        condition: service_completed_successfully
      database_seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      reencrypt:
        condition: service_started
      mock-aai:
        condition: service_healthy
      mockauth:
        condition: service_started
    environment:
      - CONFIG_FILE=/config.yaml
    extra_hosts:
      - "localhost:host-gateway"
    ports:
      - "8085:8080"
    restart: always
    volumes:
      - ./sda/download-config.yaml:/config.yaml
      - shared:/shared

  # Go-based integration test runner
  integration_test:
    container_name: download_tester
    command:
      - "/bin/sh"
      - "-c"
      - |
        cd /tests
        go mod download
        go test -v ./...
    depends_on:
      download:
        condition: service_started
    environment:
      - DOWNLOAD_URL=http://download:8080
      - JWT_KEY_FILE=/shared/keys/jwt.key
    extra_hosts:
      - "localhost:host-gateway"
    image: golang:1.25-alpine
    profiles:
      - tests
    volumes:
      - shared:/shared
      - ./tests/download:/tests

volumes:
  minio_data:
  postgres_data:
  shared:

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1400"