services:

  db:
    user: postgres
    container_name: db
    environment:
      - NOTLS=true
      - POSTGRES_PASSWORD=rootpassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 20s
      retries: 3
    image: ghcr.io/neicnordic/sensitive-data-archive:PR${PR_NUMBER}-postgres
    ports:
      - "5432:5432"
    volumes:
      - /tmp/data:/data

  database_user_creation:
    container_name: database_user_creation
    image: postgres:15.4-alpine
    command:
      - "/bin/sh"
      - "-c"
      - |
        pg_isready -h db -U postgres 
        psql -U postgres -h db -d sda -c "ALTER ROLE download LOGIN PASSWORD 'download';"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    environment:
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=rootpassword

  s3:
    extends:
      file: ../../.github/integration/ceph-rgw.yml
      service: ceph
    container_name: s3
    environment:
      - S3_SECRET_KEY=secretkey
      - S3_BUCKETS=archive
    ports:
      - "9000:9000"

  s3-2nd:
    extends:
      file: ../../.github/integration/ceph-rgw.yml
      service: ceph
    container_name: s3-2nd
    environment:
      - S3_SECRET_KEY=secretkey
    ports:
      - "9001:9000"

  download:
    command: sda-download
    container_name: download
    depends_on:
      database_user_creation:
        condition: service_completed_successfully
      s3:
        condition: service_healthy
      mockauth:
        condition: service_healthy
    environment:
      - ARCHIVE_URL=http://s3
      - ARCHIVE_TYPE=s3
      - DB_HOST=db
    image: ghcr.io/neicnordic/sensitive-data-archive:PR${PR_NUMBER}-download
    build:
      context: ..
    volumes:
      - ./config-notls.yaml:/config.yaml
      - ./:/dev_utils/
      - ./archive_data/test_file:/tmp/dir1/00000000-0000-0000-0000-000000000001
      - ./archive_data/test_file:/tmp/dir1/00000000-0000-0000-0000-000000000002
      - ./archive_data/test_file:/tmp/dir2/00000000-0000-0000-0000-000000000003
      - ./archive_data/test_file:/tmp/dir2/00000000-0000-0000-0000-000000000004
    mem_limit: 256m
    ports:
      - "8080:8080"
    restart: always

  download-unencrypted:
    command: sda-download
    container_name: download-unencrypted
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_healthy
      mockauth:
        condition: service_healthy
    environment:
      - ARCHIVE_URL=http://s3
      - ARCHIVE_TYPE=s3
      - DB_HOST=db
      - C4GH_TRANSIENTKEYPATH=/dev_utils/c4gh.sec.pem
      - C4GH_TRANSIENTPASSPHRASE=oaagCP1YgAZeEyl2eJAkHv9lkcWXWFgm
    image: ghcr.io/neicnordic/sensitive-data-archive:PR${PR_NUMBER}-download
    build:
      context: ..
    volumes:
      - ./config-notls.yaml:/config.yaml
      - ./:/dev_utils/
      - ./archive_data/test_file:/tmp/dir1/00000000-0000-0000-0000-000000000001
      - ./archive_data/test_file:/tmp/dir1/00000000-0000-0000-0000-000000000002
      - ./archive_data/test_file:/tmp/dir2/00000000-0000-0000-0000-000000000003
      - ./archive_data/test_file:/tmp/dir2/00000000-0000-0000-0000-000000000004
    mem_limit: 256m
    ports:
      - "9080:8080"
    restart: always

  mockauth:
    command:
      - /bin/sh
      - -c
      - |
        apt update
        apt install curl -y
        pip install --upgrade pip
        pip install aiohttp Authlib
        python -u /mockoidc.py
    container_name: mockauth
    image: python:3.10-slim
    healthcheck:
      test: [ "CMD", "curl", "-fkq", "http://localhost:8000/.well-known/openid-configuration" ]
      interval: 10s
      timeout: 30s
      retries: 10
    volumes:
      - ./mockoidc/mockoidc.py:/mockoidc.py
    mem_limit: 256m
    ports:
      - "8000:8000"
    restart: always

  reencrypt:
    image: ghcr.io/neicnordic/sensitive-data-archive:PR${PR_NUMBER}
    build: ../../sda/
    command: [ sda-reencrypt ]
    container_name: reencrypt
    ports:
      - "50051:50051"
    restart: always
    volumes:
      - ./config-notls.yaml:/config.yaml
      - ./:/dev_utils/

volumes:
  archive:
