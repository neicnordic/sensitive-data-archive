# Complete dev stack for end-to-end ingestion and key rotation testing
# Includes full pipeline (ingest, verify, finalize, mapper) and download/api services.
#
# Usage:
#   docker compose -f dev-key-rotation.yml up -d

name: key-rotation-test-full

services:
  postgres:
    build:
      context: ../../postgresql
    image: ghcr.io/neicnordic/sensitive-data-archive:PR${PR_NUMBER:-dev}-postgres
    environment:
      - POSTGRES_PASSWORD=rootpasswd
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 2s
      retries: 6
    ports:
      - "15432:5432"
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    build:
      context: ../../rabbitmq
    image: ghcr.io/neicnordic/sensitive-data-archive:PR${PR_NUMBER:-dev}-rabbitmq
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    ports:
      - "15672:15672"
      - "5672:5672"
    restart: always
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    networks:
      default:
        aliases:
          - s3
    environment:
      - MINIO_ROOT_USER=access
      - MINIO_ROOT_PASSWORD=secretKey
      - MINIO_SERVER_URL=http://127.0.0.1:9000
    healthcheck:
      test: ["CMD", "curl", "-fkq", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 2s
      retries: 6
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - minio_data:/data

  # Generates keys and handles bulk DB configuration for all pipeline roles
  credentials:
    command:
      - "/bin/sh"
      - "-c"
      - |
        set -e
        export DEBIAN_FRONTEND=noninteractive
        echo 'Acquire::ForceIPv4 "true";' > /etc/apt/apt.conf.d/99force-ipv4
        apt-get -o DPkg::Lock::Timeout=60 update > /dev/null
        apt-get -o DPkg::Lock::Timeout=60 install -y postgresql-client > /dev/null
        pip install --upgrade pip > /dev/null
        pip install joserfc crypt4gh > /dev/null

        # Provision permissions for all pipeline services
        for role in s3inbox ingest verify finalize mapper api download rotatekey; do
          psql -U postgres -h postgres -d sda -c "ALTER ROLE $$role LOGIN PASSWORD '$$role';" || true
          psql -U postgres -h postgres -d sda -c "GRANT base TO $$role;" || true
        done

        # Create RSA key pair for JWT signing
        mkdir -p /shared/keys/pub
        if [ ! -f "/shared/keys/jwt.key" ]; then
            cat > /shared/keys/jwt.key << 'PRIVKEY'
        -----BEGIN PRIVATE KEY-----
        MIIEvgIBADANBgkqhkiG9w0BAQEFAASCBKgwggSkAgEAAoIBAQDhuZjxPmOGUIW1
        LhxzKfxkN+1aTbvI5w+AptqT33X+bWuzfjvhEodiNz0bBfQgJJpQ3TZ8J1IZpM2F
