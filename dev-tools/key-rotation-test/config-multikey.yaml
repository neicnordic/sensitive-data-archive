# ==============================================================================
# MULTI-KEY SDA CONFIGURATION (ALL 5 KEYS REGISTERED)
# ==============================================================================

log:
  format: "json"
  level: "debug"

api:
  host: "0.0.0.0"
  port: 8080
  rbacFile: /rbac.json

service:
  id: "neicnordic.sda.download"
  org-name: "NBIS"
  org-url: "https://nbis.se"

server:
  cert: ""
  key: ""
  jwtpubkeyurl: "http://mockauth:8000/jwks"

storage:
  backend: "archive"
  archive:
    s3:
      - endpoint: "http://s3:9000"
        access_key: "access"
        secret_key: "secretKey"
        bucket_prefix: "archive"
        region: "us-east-1"
        disable_https: true
        max_buckets: 10
        max_objects: 3
  backup:
    s3:
      - endpoint: "http://s3:9000"
        access_key: "access"
        secret_key: "secretKey"
        bucket_prefix: "backup"
        region: "us-east-1"
        disable_https: true
  inbox:
    s3:
      - endpoint: "http://s3:9000"
        access_key: "access"
        secret_key: "secretKey"
        bucket_prefix: "inbox"
        region: "us-east-1"
        disable_https: true
  sync:
    s3:
      - endpoint: "http://s3:9000"
        access_key: "access"
        secret_key: "secretKey"
        bucket_prefix: "sync"
        region: "us-east-1"
        disable_https: true
        max_buckets: 10
        max_objects: 10

s3inbox:
  endpoint: "http://s3:9000"
  access_key: "access"
  secret_key: "secretKey"
  bucket: "inbox"
  region: "us-east-1"
  ready_path: "/minio/health/ready"

grpc:
  host: "reencrypt"
  port: 50051
  timeout: 30

broker:
  host: "rabbitmq"
  port: "5672"
  user: ""
  password: ""
  vhost: "/sda"
  exchange: "sda"
  routingKey: ""
  ssl: "false"

database:
  host: "postgres"
  port: "5432"
  name: "sda"
  ssl_mode: "disable"

db:
  host: "postgres"
  port: 5432
  user: "postgres"
  password: "rootpasswd"
  database: "sda"
  sslmode: "disable"

schema:
  type: "isolated"

# --- MULTI-KEY CONFIGURATION FOR CASE 6 ---
c4gh:
  filePath: /shared/rotatekey.sec.pem
  passphrase: "rotatekeyPass"
  syncPubKeyPath: /shared/sync.pub.pem
  rotatePubKeyPath: /shared/rotatekey.pub.pem

  privateKeys:
    - filePath: /shared/c4gh.sec.pem
      passphrase: "c4ghpass"
    - filePath: /shared/rotatekey.sec.pem
      passphrase: "rotatekeyPass"
    - filePath: /shared/extra_key_1.sec.pem
      passphrase: "pass1"
    - filePath: /shared/extra_key_2.sec.pem
      passphrase: "pass2"
    - filePath: /shared/extra_key_3.sec.pem
      passphrase: "pass3"
    - filePath: /shared/extra_key_4.sec.pem
      passphrase: "pass4"

jwt:
  pubkey-path: "/shared/keys/pub/"
  allow-all-data: true

permission:
  model: "combined"

auth:
  allow-opaque: false

visa:
  enabled: true
  source: "userinfo"
  userinfo-url: "http://mockauth:8000/userinfo"
  trusted-issuers-path: "/shared/trusted-issuers.json"
  dataset-id-mode: "raw"
  identity:
    mode: "broker-bound"
  validate-asserted: true
  allow-insecure-jku: true
  limits:
    max-visas: 200
    max-jwks-per-request: 10
    max-visa-size: 16384
  cache:
    token-ttl: 3600
    jwk-ttl: 300
    validation-ttl: 120
    userinfo-ttl: 60

session:
  expiration: 3600
  secure: false
  http-only: true
  name: "sda_session"

cache:
  enabled: false
  file-ttl: 300
  permission-ttl: 120
  dataset-ttl: 300

location_broker.cache_ttl: 0